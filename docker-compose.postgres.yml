services:
  postgres:
    image: postgres:16-alpine
    container_name: money-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: money_copilot
    ports:
      - "5432:5432"
    volumes:
      - money_copilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d money_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  money_copilot_pgdata:
